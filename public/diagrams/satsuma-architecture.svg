  <rect x="84" y="520" width="326" height="106" rx="12" fill="#1b1622" stroke="#2d2438" />
  <text x="104" y="548" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Unified Wallet Context</text>
  <text x="104" y="574" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Abstracts Keplr (Cosmos) and ICP Internet</text>
  <text x="104" y="594" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Identity behind a single reactive provider.</text>

  <rect x="436" y="520" width="326" height="106" rx="12" fill="#1b1622" stroke="#2d2438" />
  <text x="456" y="548" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Reactive Step Tracker</text>
  <text x="456" y="574" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Polls cross-chain GMP confirmations so users</text>
  <text x="456" y="594" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">never lose visibility mid-bridge.</text>

  <rect x="788" y="520" width="328" height="106" rx="12" fill="#1b1622" stroke="#2d2438" />
  <text x="808" y="548" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Directed Agentic Execution</text>
  <text x="808" y="574" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Delivered end-to-end UI architecture in 48h</text>
  <text x="808" y="594" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">while retaining Figma &amp; UX ownership.</text>
</svg>

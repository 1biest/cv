<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="100%" stop-color="#09080c" />
    </linearGradient>
    <pattern id="gridS" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#bgS)" />
  <rect width="1200" height="720" rx="24" fill="url(#gridS)" />

  <text x="56" y="64" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.5">
    SATSUMA // CROSS-CHAIN YIELD-TO-BTC PIPELINE
  </text>
  <text x="56" y="104" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700">
    Async Multi-Chain State Machine &amp; Multi-Wallet UX
  </text>
  <rect x="910" y="46" width="234" height="34" rx="17" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.4" />
  <text x="1027" y="68" text-anchor="middle" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
    COSMOVERSE 48H BUILD
  </text>
  <line x1="56" y1="130" x2="1144" y2="130" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- 4 Stage Pipeline -->
  <rect x="56" y="182" width="240" height="236" rx="16" fill="#1b1622" stroke="#362c44" stroke-width="1.5" />
  <text x="80" y="218" fill="#fb923c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">STAGE 01 // ORIGIN</text>
  <text x="80" y="248" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Injective Deposit</text>
  <text x="80" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">User deposits USDC into</text>
  <text x="80" y="302" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Injective vault contract.</text>
  <rect x="80" y="338" width="192" height="52" rx="10" fill="#100d14" stroke="#2d2438" />
  <text x="96" y="362" fill="#fdba74" font-family="ui-monospace, monospace" font-size="11" font-weight="700">SIGNER CONTEXT</text>
  <text x="96" y="380" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Keplr / OIS / MetaMask</text>

  <path d="M 296 300 L 332 300" stroke="#fb923c" stroke-width="2" />
  <polygon points="332,295 342,300 332,305" fill="#fb923c" />

  <rect x="344" y="182" width="240" height="236" rx="16" fill="#1b1622" stroke="#362c44" stroke-width="1.5" />
  <text x="368" y="218" fill="#fb923c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">STAGE 02 // YIELD SWAP</text>
  <text x="368" y="248" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Astroport Skim</text>
  <text x="368" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Yield skimmed &amp; swapped</text>
  <text x="368" y="302" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">via Astroport AMM pools.</text>
  <rect x="368" y="338" width="192" height="52" rx="10" fill="#100d14" stroke="#2d2438" />
  <text x="384" y="362" fill="#fdba74" font-family="ui-monospace, monospace" font-size="11" font-weight="700">INDEXER SYNC</text>
  <text x="384" y="380" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Pool Rates &amp; Slippage</text>

  <path d="M 584 300 L 620 300" stroke="#fb923c" stroke-width="2" />
  <polygon points="620,295 630,300 620,305" fill="#fb923c" />

  <rect x="632" y="182" width="240" height="236" rx="16" fill="#1b1622" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="656" y="218" fill="#fb923c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">STAGE 03 // RELAY</text>
  <text x="656" y="248" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Axelar GMP Bridge</text>
  <text x="656" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">General Message Passing</text>
  <text x="656" y="302" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">tracks async tx handoff.</text>
  <rect x="656" y="338" width="192" height="52" rx="10" fill="#100d14" stroke="#2d2438" />
  <text x="672" y="362" fill="#fdba74" font-family="ui-monospace, monospace" font-size="11" font-weight="700">LIVE TRANSITIONS</text>
  <text x="672" y="380" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Broadcast -&gt; Relayed</text>

  <path d="M 872 300 L 908 300" stroke="#fb923c" stroke-width="2" />
  <polygon points="908,295 918,300 908,305" fill="#fb923c" />

  <rect x="920" y="182" width="224" height="236" rx="16" fill="#1b1622" stroke="#362c44" stroke-width="1.5" />
  <text x="944" y="218" fill="#fb923c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">STAGE 04 // TARGET</text>
  <text x="944" y="248" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">ICP BTC Canister</text>
  <text x="944" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Canister executes Bitcoin</text>
  <text x="944" y="302" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">conversion &amp; custody.</text>
  <rect x="944" y="338" width="176" height="52" rx="10" fill="#100d14" stroke="#2d2438" />
  <text x="960" y="362" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">IDENTITY SYNC</text>
  <text x="960" y="380" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Internet Identity</text>

  <!-- Bottom UX Bar -->
  <rect x="56" y="458" width="1088" height="200" rx="16" fill="#120f17" stroke="#362c44" stroke-width="1.5" />
  <text x="84" y="496" fill="#fb923c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">

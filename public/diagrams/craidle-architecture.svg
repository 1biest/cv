  <text x="646" y="254" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">AgentBudgetManager</text>
  <text x="646" y="284" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Enforces spending caps and</text>
  <text x="646" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">routes compute credits to</text>
  <text x="646" y="324" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12">Incubating -&gt; Graduated</text>


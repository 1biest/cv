  <text x="382" y="496" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. OpenClaw Loop</text>
  <text x="382" y="522" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Gateway orchestrates</text>
  <text x="382" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">multi-file edits across</text>
  <text x="382" y="558" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Solidity + React TSX.</text>

  <path d="M 596 532 L 628 532" stroke="#fbbf24" stroke-width="2" />
  <polygon points="628,527 638,532 628,537" fill="#fbbf24" />

  <rect x="640" y="468" width="234" height="128" rx="12" fill="#131c30" stroke="#263652" />
  <text x="660" y="496" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">3. Verification Scripts</text>
  <text x="660" y="522" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automated build checks,</text>
  <text x="660" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">type safety, and testnet</text>
  <text x="660" y="558" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">deployment validation.</text>

  <path d="M 874 532 L 906 532" stroke="#fbbf24" stroke-width="2" />
  <polygon points="906,527 916,532 906,537" fill="#fbbf24" />

  <rect x="918" y="468" width="198" height="128" rx="12" fill="#131c30" stroke="#4ade80" stroke-opacity="0.45" />
  <text x="938" y="496" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4. Live Testnet</text>
  <text x="938" y="522" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">4 Solidity contracts +</text>
  <text x="938" y="540" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Next.js dashboard live</text>

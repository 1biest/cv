  <text x="940" y="284" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Deploys agent ERC-20;</text>
  <text x="940" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">0.25% fee replenishes</text>
  <text x="940" y="324" fill="#4ade80" font-family="ui-monospace, monospace" font-size="12">Autonomous Runway</text>


  <text x="362" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">harvested independently</text>
  <text x="362" y="324" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="12">Yield -&gt; Budget Only</text>


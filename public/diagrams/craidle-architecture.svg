      <stop offset="0%" stop-color="#0d1321" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <pattern id="gridC" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="720" rx="24" fill="url(#bgC)" />
  <rect width="1200" height="720" rx="24" fill="url(#gridC)" />

  <text x="56" y="64" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.5">
    CRAIDLE // SYNTHESIS HACKATHON ARCHITECTURE
  </text>
  <text x="56" y="104" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700">

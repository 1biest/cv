  <text x="104" y="522" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Define contract boundaries,</text>
  <text x="104" y="540" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Next.js dashboard states,</text>
  <text x="104" y="558" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">&amp; Ethers.js error paths.</text>


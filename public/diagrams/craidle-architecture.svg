  <text x="78" y="254" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">IncubatorVault.sol</text>
  <text x="78" y="284" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Locks user principal capital</text>
  <text x="78" y="304" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">during incubation window;</text>
  <text x="78" y="324" fill="#4ade80" font-family="ui-monospace, monospace" font-size="12">Principal = Non-Spendable</text>

